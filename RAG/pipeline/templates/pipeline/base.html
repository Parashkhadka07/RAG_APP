<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Notebook RAG{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: '#1c1c1e',
                        paper: '#fafaf9',
                        accent: '#3454d1',
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'Inter', 'Segoe UI', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-paper text-ink font-sans min-h-screen flex flex-col">
    <header class="border-b border-ink/10 bg-white">
        <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="{% url 'notebook_list' %}" class="font-semibold text-lg tracking-tight">
                Notebook<span class="text-accent">RAG</span>
            </a>
            {% if user.is_authenticated %}
            <span class="text-sm text-ink/50">{{ user.username }}</span>
            {% endif %}
        </div>
    </header>

    <main class="flex-1">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
