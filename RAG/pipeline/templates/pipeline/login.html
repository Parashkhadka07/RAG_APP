<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in · NotebookRAG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { bg: '#0b0b0d', panel: '#151517', border: '#2a2a2e', accent: '#6d8dff', ink: '#e8e8ea', muted: '#9a9aa2' } } }
        }
    </script>
</head>
<body class="bg-bg text-ink min-h-screen flex items-center justify-center font-sans">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <a href="{% url 'notebook_list' %}" class="font-semibold text-xl tracking-tight">
                Notebook<span class="text-accent">RAG</span>
            </a>
            <p class="text-sm text-muted mt-1">Log in to your notebooks</p>
        </div>

        <form method="POST" class="bg-panel border border-border rounded-2xl p-6 space-y-4">
            {% csrf_token %}

            {% if form.errors %}
            <div class="text-sm text-red-400 bg-red-950/40 border border-red-900 rounded-lg px-3 py-2">
                Invalid username or password.
            </div>
            {% endif %}

            <div>
                <label class="block text-xs text-muted mb-1">Username</label>
                <input type="text" name="username" required autofocus
                       class="w-full bg-bg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/50">
            </div>
            <div>
                <label class="block text-xs text-muted mb-1">Password</label>
                <input type="password" name="password" required
                       class="w-full bg-bg border border-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent/50">
            </div>

            <button type="submit"
                    class="w-full bg-accent text-bg font-medium py-2 rounded-lg hover:opacity-90 transition">
                Log in
            </button>
        </form>

        <p class="text-center text-sm text-muted mt-4">
            No account? <a href="{% url 'signup' %}" class="text-accent hover:underline">Sign up</a>
        </p>
    </div>
</body>
</html>
